[project]
name = "token-budget-proxy"
version = "0.1.0"
description = "A metering, policy-enforcing proxy for the Claude Messages API, and a waste report for what it records."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx2>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tbp = "tbp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tbp"]
