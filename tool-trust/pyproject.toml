[project]
name = "tool-trust"
version = "0.0.1"
description = "Does an agent notice when its tools lie to it?"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
# The model call is not wired up yet; this is what it will need.
agent = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tt = "tt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tt"]
